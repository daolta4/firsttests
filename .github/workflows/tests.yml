name: Chay test tu dong
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore
      - run: dotnet test --logger "trx" --results-directory ./ketqua
        env:
          Headless: 'true'
      - uses: actions/upload-artifact@v4
        if: always() # ← chạy cả khi test RỚT (quan trọng)
        with:
          name: ket-qua-test
          path: |
            ./ketqua
            **/bin/Debug/net10.0/screenshots/**
